<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Passionists of Holy Cross Province — Branded Merchandise</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Jost:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary:      #5C1D21;
      --primary-dark: #3d1216;
      --primary-mid:  #7B272C;
      --gold:         #A07400;
      --gold-light:   #F2E2BE;
      --ink:          #2D2926;
      --gray:         #575451;
      --mid-gray:     #888780;
      --border:       #E8DEC8;
      --bg:           #F7EED8;
      --card:         #FFFFFF;
      --pale:         #FBF9ED;
      --navy:         #002B46;
      --red:          #A4343A;
      --radius:       10px;
      --font:         'Jost', Georgia, serif;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      background-color: var(--navy);
      background-image:
        radial-gradient(ellipse at 20% 50%, rgba(92,29,33,0.6) 0%, transparent 60%),
        radial-gradient(ellipse at 80% 20%, rgba(0,43,70,0.8) 0%, transparent 50%),
        radial-gradient(ellipse at 60% 80%, rgba(92,29,33,0.3) 0%, transparent 40%);
    }

    /* ── CARD ── */
    .card {
      background: var(--card);
      border-radius: 16px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 24px 60px rgba(0,0,0,0.4), 0 2px 0 rgba(255,255,255,0.05);
      overflow: hidden;
    }

    /* ── HEADER BAND ── */
    .card-header {
      background: var(--primary);
      padding: 28px 32px 24px;
      text-align: center;
      position: relative;
    }
    .card-header::after {
      content: '';
      position: absolute;
      bottom: -1px;
      left: 0;
      right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
    }
    .logo-wrap {
      width: 90px;
      height: 90px;
      margin: 0 auto 14px;
      background: #ffffff;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 3px solid rgba(255,255,255,0.3);
      box-shadow: 0 2px 16px rgba(0,0,0,0.3);
      overflow: hidden;
      padding: 6px;
    }
    .logo-wrap img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    .card-header-label {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.55);
      margin-bottom: 4px;
    }
    .card-header-title {
      font-size: 17px;
      font-weight: 600;
      color: #fff;
      line-height: 1.3;
    }
    .card-header-sub {
      font-size: 12px;
      color: rgba(255,255,255,0.5);
      margin-top: 4px;
      font-style: italic;
    }

    /* ── BODY ── */
    .card-body { padding: 28px 32px 32px; }

    /* ── TABS ── */
    .tabs {
      display: flex;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 3px;
      gap: 3px;
      margin-bottom: 24px;
      background: var(--pale);
    }
    .tab-btn {
      flex: 1;
      padding: 8px;
      border: none;
      background: transparent;
      border-radius: 7px;
      font-family: var(--font);
      font-size: 13px;
      font-weight: 500;
      color: var(--mid-gray);
      cursor: pointer;
      transition: all .18s;
    }
    .tab-btn.active {
      background: var(--primary);
      color: #fff;
      box-shadow: 0 1px 4px rgba(92,29,33,0.3);
    }

    /* ── FIELDS ── */
    .field { margin-bottom: 14px; }
    .field label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--gray);
      margin-bottom: 5px;
      letter-spacing: .02em;
    }
    .field input,
    .field select {
      width: 100%;
      padding: 11px 14px;
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      font-family: var(--font);
      font-size: 14px;
      color: var(--ink);
      background: var(--pale);
      outline: none;
      transition: border-color .15s, background .15s;
    }
    .field input:focus,
    .field select:focus {
      border-color: var(--primary);
      background: #fff;
    }

    /* ── BUTTONS ── */
    .btn {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: var(--radius);
      font-family: var(--font);
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all .18s;
      letter-spacing: .01em;
    }
    .btn-primary {
      background: var(--primary);
      color: #fff;
    }
    .btn-primary:hover { background: var(--primary-dark); }
    .btn-primary:disabled { opacity: .6; cursor: not-allowed; }
    .btn-ghost {
      background: var(--pale);
      color: var(--gray);
      border: 1.5px solid var(--border);
      padding: 11px;
      font-size: 14px;
    }
    .btn-ghost:hover { background: var(--gold-light); color: var(--ink); }

    /* ── ERROR ── */
    .err {
      font-size: 13px;
      color: var(--red);
      background: #FDF0F0;
      border: 1px solid #F5C6C6;
      border-radius: var(--radius);
      padding: 10px 13px;
      margin-bottom: 12px;
      display: none;
      line-height: 1.5;
    }
    .err.show { display: block; }

    /* ── STEP DOTS ── */
    .step-dots {
      display: flex;
      justify-content: center;
      gap: 7px;
      margin-bottom: 20px;
    }
    .dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--border);
      transition: background .2s, transform .2s;
    }
    .dot.active { background: var(--primary); transform: scale(1.2); }
    .dot.done   { background: var(--gold); }

    /* ── STEPS ── */
    .step { display: none; }
    .step.active { display: block; }
    .step-hint {
      font-size: 13px;
      color: var(--mid-gray);
      text-align: center;
      margin-bottom: 18px;
      line-height: 1.6;
    }

    /* ── LOCATION SEARCH ── */
    .location-wrap { position: relative; }
    .location-dropdown {
      position: absolute;
      top: calc(100% + 4px);
      left: 0; right: 0;
      background: #fff;
      border: 1.5px solid var(--primary);
      border-radius: var(--radius);
      box-shadow: 0 8px 24px rgba(0,0,0,0.12);
      max-height: 210px;
      overflow-y: auto;
      z-index: 50;
      display: none;
    }
    .location-dropdown.open { display: block; }
    .loc-option {
      padding: 11px 14px;
      font-size: 13px;
      color: var(--ink);
      cursor: pointer;
      border-bottom: 1px solid var(--border);
      transition: background .1s;
      line-height: 1.4;
    }
    .loc-option:last-child { border-bottom: none; }
    .loc-option:hover,
    .loc-option.selected { background: #FDF5F5; color: var(--primary); font-weight: 500; }

    /* ── NAV BETWEEN STEPS ── */
    .step-nav { display: flex; gap: 10px; margin-top: 6px; }
    .step-nav .btn { flex: 1; }
    .step-nav .btn-ghost { flex: 0 0 90px; }

    /* ── DIVIDER ── */
    .or-divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 14px 0;
      color: var(--mid-gray);
      font-size: 12px;
    }
    .or-divider::before, .or-divider::after {
      content: '';
      flex: 1;
      border-top: 1px solid var(--border);
    }

    /* ── POWERED BY ── */
    .powered {
      text-align: center;
      margin-top: 18px;
      font-size: 11px;
      color: rgba(255,255,255,0.3);
    }
    .powered a { color: rgba(255,255,255,0.45); text-decoration: none; }
    .powered a:hover { color: rgba(255,255,255,0.7); }

    @media (max-width: 480px) {
      .card-body { padding: 22px 20px 28px; }
      .card-header { padding: 24px 20px 20px; }
    }
  </style>
</head>
<body>

  <div style="width:100%;max-width:420px">
    <div class="card">

      <!-- Header -->
      <div class="card-header">
        <div class="logo-wrap">
          <img src="assets/passionist-sign.png" alt="Passionist crest">
        </div>
        <div class="card-header-label">Branded Merchandise</div>
        <div class="card-header-title">Passionists of Holy Cross Province</div>
        <div class="card-header-sub">Location Ordering Portal</div>
      </div>

      <!-- Body -->
      <div class="card-body">

        <!-- Tabs -->
        <div class="tabs">
          <button class="tab-btn active" id="tab-signin"   onclick="switchTab('signin')">Sign in</button>
          <button class="tab-btn"        id="tab-register" onclick="switchTab('register')">Register</button>
        </div>

        <!-- ── SIGN IN ── -->
        <div id="panel-signin">
          <div class="field">
            <label>Email address</label>
            <input type="email" id="si-email" placeholder="you@example.com" autocomplete="email">
          </div>
          <div class="field">
            <label>Password</label>
            <input type="password" id="si-password" placeholder="••••••••" autocomplete="current-password">
          </div>
          <div class="err" id="si-error"></div>
          <button class="btn btn-primary" id="si-btn" onclick="doSignIn()">Sign in</button>

        </div>

        <!-- ── REGISTER ── -->
        <div id="panel-register" style="display:none">

          <div class="step-dots">
            <div class="dot active" id="dot-1"></div>
            <div class="dot"        id="dot-2"></div>
            <div class="dot"        id="dot-3"></div>
          </div>

          <!-- Step 1: Access code -->
          <div class="step active" id="step-1">
            <p class="step-hint">Enter the access code provided by your organization.</p>
            <div class="field">
              <label>Access code</label>
              <input type="text" id="reg-code" placeholder="e.g. ASSEMBLY26"
                style="text-transform:uppercase;letter-spacing:.12em;font-weight:600;font-size:15px;text-align:center"
                oninput="this.value=this.value.toUpperCase().trim()">
            </div>
            <div class="err" id="code-error"></div>
            <button class="btn btn-primary" id="code-btn" onclick="validateCode()">Continue →</button>
          </div>

          <!-- Step 2: Name + Location -->
          <div class="step" id="step-2">
            <p class="step-hint">Who are you and which location are you ordering for?</p>
            <div class="field">
              <label>Your name</label>
              <input type="text" id="reg-name" placeholder="First and last name" autocomplete="name">
            </div>
            <div class="field">
              <label>Your location</label>
              <div class="location-wrap">
                <input type="text" id="reg-loc-input" placeholder="Type to search…"
                  oninput="filterLocs(this.value)"
                  onfocus="openLocs()"
                  autocomplete="off">
                <div class="location-dropdown" id="loc-dropdown"></div>
              </div>
              <input type="hidden" id="reg-loc-id">
              <input type="hidden" id="reg-loc-name">
            </div>
            <div class="err" id="step2-error"></div>
            <div class="step-nav">
              <button class="btn btn-ghost" onclick="goStep(1)">← Back</button>
              <button class="btn btn-primary" onclick="validateStep2()">Continue →</button>
            </div>
          </div>

          <!-- Step 3: Credentials -->
          <div class="step" id="step-3">
            <p class="step-hint">Create your login credentials.</p>
            <div class="field">
              <label>Email address</label>
              <input type="email" id="reg-email" placeholder="you@example.com" autocomplete="email">
            </div>
            <div class="field">
              <label>Password</label>
              <input type="password" id="reg-pw" placeholder="At least 8 characters" autocomplete="new-password">
            </div>
            <div class="field">
              <label>Confirm password</label>
              <input type="password" id="reg-confirm" placeholder="Re-enter password" autocomplete="new-password">
            </div>
            <div class="err" id="step3-error"></div>
            <div class="step-nav">
              <button class="btn btn-ghost" onclick="goStep(2)">← Back</button>
              <button class="btn btn-primary" id="reg-btn" onclick="doRegister()">Create account</button>
            </div>
          </div>

        </div><!-- /panel-register -->

      </div><!-- /card-body -->
    </div><!-- /card -->

    <div class="powered">Powered by <a href="https://commonprintco.com" target="_blank">Common Print Co.</a></div>
  </div>

<script type="module">
  import { VERSION } from '../../shared/version.js';

  const STOREFRONT_ID = 'passionist-holy-cross';

  const LOCATIONS = [
    { id: 'christ-the-king', name: 'Christ the King Passionist Retreat Center (Citrus Heights, CA)' },
    { id: 'holy-name',       name: 'Holy Name Passionist Retreat Center (Houston, TX)' },
    { id: 'mater-dolorosa',  name: 'Mater Dolorosa Passionist Retreat Center (Sierra Madre, CA)' },
    { id: 'st-paul-cross',   name: 'St. Paul of the Cross Passionist Retreat & Conference Center (Detroit, MI)' },
    { id: 'other',           name: 'Other / Not listed' },
  ];

  let currentStep     = 1;
  let validatedCode   = null;
  let selectedLoc     = null;

  // ── TAB SWITCHING — defined immediately so tab clicks work during init ──
  window.switchTab = (tab) => {
    document.getElementById('panel-signin').style.display   = tab === 'signin'   ? 'block' : 'none';
    document.getElementById('panel-register').style.display = tab === 'register' ? 'block' : 'none';
    document.getElementById('tab-signin').classList.toggle('active',   tab === 'signin');
    document.getElementById('tab-register').classList.toggle('active', tab === 'register');
    document.querySelectorAll('.err').forEach(e => e.classList.remove('show'));
  };

  // ── SIGN IN ────────────────────────────────────────────────────────────
  window.doSignIn = async () => {
    const email = document.getElementById('si-email').value.trim();
    const pw    = document.getElementById('si-password').value;
    const err   = document.getElementById('si-error');
    const btn   = document.getElementById('si-btn');
    err.classList.remove('show');

    if (!email || !pw) {
      err.textContent = 'Please enter your email and password.';
      err.classList.add('show'); return;
    }
    btn.disabled = true; btn.textContent = 'Signing in…';
    try {
      const cred = await signIn(email, pw);
      callWorker('update_last_login', { uid: cred.user.uid }).catch(() => {});
      window.location.href = 'catalog.html';
    } catch(e) {
      err.textContent = authError(e.code);
      err.classList.add('show');
      btn.disabled = false; btn.textContent = 'Sign in';
    }
  };

  // ── STEP NAV ───────────────────────────────────────────────────────────
  window.goStep = (n) => {
    document.querySelectorAll('.step').forEach((el, i) => el.classList.toggle('active', i+1 === n));
    document.querySelectorAll('.dot').forEach((d, i) => {
      d.classList.toggle('active', i+1 === n);
      d.classList.toggle('done',   i+1 < n);
    });
    document.querySelectorAll('.err').forEach(e => e.classList.remove('show'));
    currentStep = n;
  };

  // ── STEP 1: ACCESS CODE ────────────────────────────────────────────────
  window.validateCode = async () => {
    const code = document.getElementById('reg-code').value.trim().toUpperCase();
    const err  = document.getElementById('code-error');
    const btn  = document.getElementById('code-btn');
    err.classList.remove('show');
    if (!code) { err.textContent = 'Please enter your access code.'; err.classList.add('show'); return; }
    btn.disabled = true; btn.textContent = 'Checking…';
    try {
      const res = await callWorker('validate_code', { code, storefrontId: STOREFRONT_ID });
      if (!res.valid) {
        err.textContent = res.error || 'Invalid access code. Please check with your organization.';
        err.classList.add('show');
      } else {
        validatedCode = { codeId: res.codeId, codeLabel: res.codeLabel };
        goStep(2);
      }
    } catch(e) {
      err.textContent = 'Unable to verify. Please try again.';
      err.classList.add('show');
    }
    btn.disabled = false; btn.textContent = 'Continue →';
  };

  // ── LOCATION DROPDOWN ──────────────────────────────────────────────────
  window.filterLocs = (q) => {
    const list = q.trim() ? LOCATIONS.filter(l => l.name.toLowerCase().includes(q.toLowerCase())) : LOCATIONS;
    renderLocs(list);
    document.getElementById('loc-dropdown').classList.add('open');
  };
  window.openLocs = () => { filterLocs(document.getElementById('reg-loc-input').value); };

  function renderLocs(list) {
    document.getElementById('loc-dropdown').innerHTML = list.length === 0
      ? '<div class="loc-option" style="color:var(--mid-gray)">No locations found</div>'
      : list.map(l => `
          <div class="loc-option ${selectedLoc?.id === l.id ? 'selected' : ''}"
            onclick="pickLoc('${l.id}','${l.name.replace(/'/g,"\\'")}')">${l.name}</div>`
        ).join('');
  }

  window.pickLoc = (id, name) => {
    selectedLoc = { id, name };
    document.getElementById('reg-loc-input').value = name;
    document.getElementById('reg-loc-id').value    = id;
    document.getElementById('reg-loc-name').value  = name;
    document.getElementById('loc-dropdown').classList.remove('open');
  };

  document.addEventListener('click', e => {
    if (!e.target.closest('.location-wrap'))
      document.getElementById('loc-dropdown').classList.remove('open');
  });

  // ── STEP 2: NAME + LOCATION ────────────────────────────────────────────
  window.validateStep2 = () => {
    const name = document.getElementById('reg-name').value.trim();
    const err  = document.getElementById('step2-error');
    err.classList.remove('show');
    if (!name)        { err.textContent = 'Please enter your name.';             err.classList.add('show'); return; }
    if (!selectedLoc) { err.textContent = 'Please select your location.'; err.classList.add('show'); return; }
    goStep(3);
  };

  // ── STEP 3: CREATE ACCOUNT ─────────────────────────────────────────────
  window.doRegister = async () => {
    const name    = document.getElementById('reg-name').value.trim();
    const email   = document.getElementById('reg-email').value.trim();
    const pw      = document.getElementById('reg-pw').value;
    const confirm = document.getElementById('reg-confirm').value;
    const err     = document.getElementById('step3-error');
    const btn     = document.getElementById('reg-btn');
    err.classList.remove('show');

    if (!email)       { err.textContent = 'Please enter your email address.';      err.classList.add('show'); return; }
    if (pw.length<8)  { err.textContent = 'Password must be at least 8 characters.'; err.classList.add('show'); return; }
    if (pw !== confirm){ err.textContent = "Passwords don't match.";               err.classList.add('show'); return; }

    btn.disabled = true; btn.textContent = 'Creating account…';
    try {
      const cred = await register(email, pw);
      await callWorker('register_storefront_user', {
        uid: cred.user.uid, email, name,
        locationId:      selectedLoc.id,
        locationName:    selectedLoc.name,
        storefrontId:    STOREFRONT_ID,
        accessCodeId:    validatedCode.codeId,
        accessCodeLabel: validatedCode.codeLabel,
      });
      window.location.href = 'catalog.html';
    } catch(e) {
      err.textContent = authError(e.code) || 'Registration failed. Please try again.';
      err.classList.add('show');
      btn.disabled = false; btn.textContent = 'Create account';
    }
  };

  // ── ENTER KEY ──────────────────────────────────────────────────────────
  document.addEventListener('keydown', e => {
    if (e.key !== 'Enter') return;
    const signinVisible = document.getElementById('panel-signin').style.display !== 'none';
    if (signinVisible)        doSignIn();
    else if (currentStep===1) validateCode();
    else if (currentStep===2) validateStep2();
    else if (currentStep===3) doRegister();
  });

  // ── INIT — after all handlers defined so buttons work during load ───────
  const { initAuth, signIn, register, redirectIfAuthed, authError } =
    await import(`../../shared/auth.js?v=${VERSION}`);
  const { WORKER_URL, callWorker } =
    await import(`../../shared/utils.js?v=${VERSION}`);

  await initAuth(WORKER_URL);
  await redirectIfAuthed('catalog.html');
</script>

</body>
</html>
